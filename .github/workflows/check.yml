name: Check branch

# Agent and feature branches: build and test both halves without publishing a release, and print
# the Minecraft 26.3 API asked for in .github/probe.txt (for writing code where Minecraft's jars
# can't be downloaded).
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      skse: ${{ steps.diff.outputs.skse }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does the branch change the Skyrim plugin or the protocol (against dev)?
        id: diff
        run: |
          git fetch -q origin dev
          if git diff --name-only origin/dev...HEAD | grep -qE '^(skse|protocol)/'; then
            echo "skse=true" >> "$GITHUB_OUTPUT"
          else
            echo "skse=false" >> "$GITHUB_OUTPUT"
          fi

  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test the Fabric mod
        working-directory: fabric
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew build --no-configuration-cache 2>&1 | tee build.log; then
            msg=$(grep -E -A4 "error:|FAILED|What went wrong|Exception|expected:" build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build failed::$msg"
            exit 1
          fi

      - name: Keep the jar for the smoke test
        run: cp "fabric/build/libs/skycraft-$(grep '^version=' fabric/gradle.properties | cut -d= -f2).jar" skycraft.jar

      - uses: actions/upload-artifact@v4
        with:
          name: skycraft-jar
          path: skycraft.jar

  # Boots a real Fabric dedicated server with the jar (tools/smoke_server.py): a broken mixin or data
  # pack fails here instead of in a player's game. Windows, since SkyLink binds kernel32.
  smoke:
    needs: fabric
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/download-artifact@v4
        with:
          name: skycraft-jar

      - name: Run the server
        shell: bash
        run: python tools/smoke_server.py skycraft.jar smoke

  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Minecraft
        working-directory: fabric
        run: |
          chmod +x gradlew
          ./gradlew help --no-configuration-cache -q > /dev/null 2>&1 || ./gradlew help --no-configuration-cache

      # One line per entry: a class name (javap -p), "-c <class>" (with bytecode), a resource path inside
      # the Minecraft jar ("data/minecraft/...json") printed as text, or "list:<prefix>" for the jar's
      # files under a path ("list:assets/minecraft/items/" is every item). "#" comments.
      - name: Print the probed API
        run: |
          jars=$(find ~/.gradle fabric/.gradle -name '*.jar' 2>/dev/null | grep -i minecraft | grep -v -i -E 'sources|fabric-api|loader|mapping|intermediary' )
          cp=""
          for j in $jars; do
            if unzip -l "$j" 2>/dev/null | grep -q -E 'net/minecraft/(world|client)/'; then cp="$cp:$j"; echo "jar: $j"; fi
          done
          cp="${cp#:}"
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%%#*}"; line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            echo; echo "======== $line"
            case "$line" in
              -c\ *) javap -p -c -cp "$cp" "${line#-c }" 2>&1 ;;
              list:*) for j in ${cp//:/ }; do unzip -Z1 "$j" 2>/dev/null; done | grep "^${line#list:}" | sort -u ;;
              */*) for j in ${cp//:/ }; do unzip -p "$j" "$line" 2>/dev/null && break; done ;;
              *) javap -p -cp "$cp" "$line" 2>&1 ;;
            esac
          done < <(cat .github/probe.txt 2>/dev/null)
          echo; echo "======== end of probe"

  skse:
    needs: changes
    if: needs.changes.outputs.skse == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ hashFiles('skse/vcpkg.json') }}
          restore-keys: vcpkg-

      - name: Build the SKSE plugin
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
          # github.com commit .patch links often 504 from runners; retry them patiently.
          X_VCPKG_ASSET_SOURCES: "x-script,curl.exe -fsSL --retry 12 --retry-all-errors --retry-delay 20 --max-time 240 -o {dst} {url}"
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsMajor = [int](& $vswhere -latest -products * -property installationVersion).Split('.')[0]
          $generator = switch ($vsMajor) { 18 { "Visual Studio 18 2026" } 17 { "Visual Studio 17 2022" } default { throw "Unexpected Visual Studio $vsMajor" } }
          Write-Output "Using $generator"
          cmake -S skse -B skse/build -G $generator -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md *>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $msg = (Get-Content configure.log | Select-String -Pattern "error|Error|CMake Error" -Context 0,4 | Select-Object -First 30 | Out-String)
            $msg = $msg -replace "%","%25" -replace "`r","" -replace "`n","%0A"
            Write-Output "::error title=Configure failed::$msg"
            exit 1
          }
          cmake --build skse/build --config RelWithDebInfo --target SkyCraft -- /m *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $msg = (Get-Content build.log | Select-String -Pattern ": error |: fatal error " | Select-Object -First 40 | Out-String)
            $msg = $msg -replace "%","%25" -replace "`r","" -replace "`n","%0A"
            Write-Output "::error title=Build failed::$msg"
            exit 1
          }
